<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101311">
<title>Al Hosn Festival 2027 | English HSE Induction</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101311;color:#f6f6f2;font-family:Arial,sans-serif}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid #ffffff20}
header strong{font-size:15px}header span{font-size:13px;color:#c4cbc5}
#stage{position:relative;flex:1;min-height:240px;background:#000;display:flex;align-items:center;justify-content:center}
#player{position:absolute;inset:0;width:100%;height:100%;border:0}
#prompt{position:relative;z-index:1;text-align:center;padding:24px;background:#101311ed;border:1px solid #ffffff30;border-radius:16px;max-width:420px;margin:20px}
#prompt p{line-height:1.5;color:#d6ddd7;margin:0 0 16px}
button{min-height:46px;padding:10px 18px;border:1px solid #ffffff38;border-radius:8px;background:#242b25;color:#fff;font:inherit;cursor:pointer}
button:hover{background:#354037}button:focus-visible,select:focus-visible{outline:3px solid #edb65d;outline-offset:3px}
button:disabled{opacity:.5;cursor:wait}
#start{background:#edb65d;color:#181d19;border:0;font-weight:bold}
[hidden]{display:none!important}
footer{padding:16px 24px 20px;background:#101311}
#progress{width:100%;height:5px;display:block;accent-color:#edb65d;margin:0 0 14px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#time{font-size:14px;color:#c4cbc5;font-variant-numeric:tabular-nums;margin-inline:4px auto}
#status{font-size:13px;color:#c4cbc5;line-height:1.5;margin:12px 0 0;min-height:20px}
#captions{min-height:46px;max-width:160px;border:1px solid #ffffff38;border-radius:8px;background:#242b25;color:white;font:inherit;padding:8px}
@media(max-width:600px){header{padding:14px 16px}header span{max-width:130px;text-align:right}footer{padding:12px 16px 16px}.toolbar{gap:8px}button{padding:10px 12px}#time{font-size:12px}#stage{min-height:220px}}
</style>
</head>
<body>
<main id="induction">
  <header><strong>Al Hosn Festival 2027</strong><span>English · HSE induction</span></header>
  <section id="stage" aria-label="English induction video">
    <iframe id="player" title="Al Hosn Festival 2027 English health and safety induction" src="https://player.vimeo.com/video/1241982436?autoplay=1&amp;muted=0&amp;quality=1080p&amp;controls=0&amp;keyboard=0&amp;skipping_forward=0&amp;speed=0&amp;pip=0&amp;title=0&amp;byline=0&amp;portrait=0&amp;vimeo_logo=0&amp;loop=0&amp;playsinline=1&amp;dnt=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="prompt"><p id="prompt-text">Loading your English induction…</p><button id="start" hidden>Play induction</button></div>
  </section>
  <footer>
    <progress id="progress" max="100" value="0" aria-label="Video progress"></progress>
    <div class="toolbar">
      <button id="toggle" disabled>Play</button>
      <button id="sound" disabled>Mute</button>
      <span id="time">0:00 / --:--</span>
      <select id="captions" aria-label="Captions" hidden></select>
      <button id="fullscreen">Fullscreen</button>
    </div>
    <p id="status" role="status" aria-live="polite">The completion form opens after the full video finishes.</p>
  </footer>
</main>
<noscript>This induction needs JavaScript enabled to play the video and open the completion form.</noscript>
<script>
'use strict';
const FORM_URL = 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=iXCtcye7ykC0WzyCSnBHASHAGHxqVudJkZcqKzBkScNURVc1MUdMMVJONU1BT0tJWDY5MEFLSkdHQyQlQCN0PWcu';
const STORAGE_KEY = 'ahf27_vimeo_1241982436_progress';
const el = id => document.getElementById(id);
let player, ready = false, playing = false, muted = false, correcting = false, completed = false;
let maxWatched = 0, duration = 0, lastSeconds = 0, lastTick = performance.now();
function clock(seconds){
  const value = Math.max(0, Math.floor(seconds));
  return Math.floor(value / 60) + ':' + String(value % 60).padStart(2, '0');
}
function prompt(message, showButton = true){
  el('prompt-text').textContent = message;
  el('prompt').hidden = false;
  el('start').hidden = !showButton;
}
function status(message){ el('status').textContent = message; }
function saveProgress(){
  try { localStorage.setItem(STORAGE_KEY, String(maxWatched)); } catch (_) {}
}
async function correctSeek(){
  if (correcting || !ready) return;
  correcting = true;
  status('Please play the full video before submitting your details.');
  try { lastSeconds = await player.setCurrentTime(maxWatched); }
  catch (_) { status('Unable to restore playback. Please reload this page.'); }
  finally { lastTick = performance.now(); correcting = false; }
}
async function play(){
  if (!ready || completed) return;
  try { await player.play(); el('prompt').hidden = true; }
  catch (_) { prompt('Press Play induction to start the video with sound.'); }
}
el('start').addEventListener('click', play);
el('toggle').addEventListener('click', async () => {
  if (!ready || completed) return;
  if (!playing) return play();
  try { await player.pause(); } catch (_) { status('Please try pausing again.'); }
});
el('sound').addEventListener('click', async () => {
  if (!ready) return;
  try { await player.setMuted(!muted); }
  catch (_) { status('Unable to change sound. Please check your device volume.'); }
});
el('fullscreen').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (el('induction').requestFullscreen) await el('induction').requestFullscreen();
    else if (ready) await player.requestFullscreen();
  } catch (_) { status('Fullscreen is not available in this browser.'); }
});
document.addEventListener('fullscreenchange', () => {
  el('fullscreen').textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
});
el('captions').addEventListener('change', async event => {
  try {
    if (event.target.value) await player.enableTextTrack(event.target.value);
    else await player.disableTextTrack();
  } catch (_) { status('Unable to change captions. Please try again.'); }
});
function updateProgress(data){
  if (!ready || completed || correcting) return;
  const now = performance.now();
  const elapsed = Math.max(0, (now - lastTick) / 1000);
  duration = data.duration || duration;
  // Browser deterrent only: this is not server-verified completion or identity.
  if (data.seconds > maxWatched + Math.max(1.25, elapsed + 0.75) || (data.seconds - lastSeconds > elapsed + 0.75 && data.seconds > maxWatched)) {
    void correctSeek();
    return;
  }
  if (playing && data.seconds > maxWatched) { maxWatched = data.seconds; saveProgress(); }
  lastSeconds = data.seconds;
  lastTick = now;
  el('progress').value = duration ? Math.min(100, data.seconds / duration * 100) : 0;
  el('time').textContent = clock(data.seconds) + ' / ' + clock(duration);
}
async function finish(){
  if (completed || correcting || !duration || maxWatched < duration - 1.25) {
    if (!completed) { await correctSeek(); prompt('Please finish the full induction video.'); }
    return;
  }
  completed = true;
  playing = false;
  el('toggle').disabled = true;
  el('sound').disabled = true;
  el('progress').value = 100;
  try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
  status('Induction video finished. Opening your completion form…');
  window.location.replace(FORM_URL);
}
async function initialise(){
  if (!window.Vimeo) { prompt('The video player could not load. Please check your connection and reload.', false); return; }
  player = new Vimeo.Player(el('player'));
  const loadTimer = setTimeout(() => {
    if (!ready) prompt('The video is taking longer to load. Check your connection or reload this page.', false);
  }, 20000);
  player.on('play', () => { playing = true; lastTick = performance.now(); el('toggle').textContent = 'Pause'; el('prompt').hidden = true; });
  player.on('pause', () => { playing = false; el('toggle').textContent = 'Play'; });
  player.on('timeupdate', updateProgress);
  player.on('seeking', data => { if (ready && data.seconds > maxWatched + 0.5) void correctSeek(); });
  player.on('seeked', data => { lastSeconds = data.seconds; lastTick = performance.now(); });
  player.on('playbackratechange', data => { if (data.playbackRate !== 1) player.setPlaybackRate(1).catch(() => { player.pause().catch(() => {}); status('Please use normal playback speed.'); }); });
  player.on('volumechange', data => { muted = data.muted || data.volume === 0; el('sound').textContent = muted ? 'Unmute' : 'Mute'; });
  player.on('ended', finish);
  player.on('error', () => { prompt('The video could not play. Please reload, or contact the induction team if this continues.', false); });
  try {
    await player.ready();
    clearTimeout(loadTimer);
    duration = await player.getDuration();
    try {
      const saved = Number(localStorage.getItem(STORAGE_KEY));
      if (Number.isFinite(saved) && saved > 0 && saved < duration - 2) {
        maxWatched = saved;
        lastSeconds = await player.setCurrentTime(Math.max(0, saved - 0.5));
      }
    } catch (_) {}
    ready = true;
    lastTick = performance.now();
    el('toggle').disabled = false;
    el('sound').disabled = false;
    el('time').textContent = clock(lastSeconds) + ' / ' + clock(duration);
    player.setQuality('1080p').catch(() => { status('1080p was requested; this device may use automatic quality.'); });
    player.getMuted().then(value => { muted = value; el('sound').textContent = value ? 'Unmute' : 'Mute'; }).catch(() => {});
    player.getTextTracks().then(tracks => {
      if (!tracks.length) return;
      el('captions').append(new Option('Captions off', ''));
      tracks.forEach(track => el('captions').append(new Option(track.label || track.language, track.language)));
      el('captions').hidden = false;
    }).catch(() => {});
    await play();
  } catch (_) {
    clearTimeout(loadTimer);
    prompt('Unable to load this video. Please check your connection and Vimeo embedding permissions.', false);
  }
}
if (window.Vimeo) {
  void initialise();
} else {
  const sdk = document.createElement('script');
  sdk.src = 'https://player.vimeo.com/api/player.js';
  sdk.onload = initialise;
  sdk.onerror = () => prompt('The video player could not load. Please check your connection and reload.', false);
  document.head.append(sdk);
  setTimeout(() => {
    if (!window.Vimeo) prompt('The video player is taking longer to load. Please check your connection and reload.', false);
  }, 20000);
}
</script>
</body>
</html>
