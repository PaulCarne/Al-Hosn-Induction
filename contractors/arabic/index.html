<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101311">
<title>مهرجان الحصن 2027 | التعريف بالصحة والسلامة باللغة العربية – عرض جماعي للمقاولين</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101311;color:#f6f6f2;font-family:Arial,sans-serif}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid #ffffff20}
header strong{font-size:15px}header span{font-size:13px;color:#c4cbc5}
#stage{position:relative;flex:1;min-height:240px;background:#000;display:flex;align-items:center;justify-content:center}
#player{position:absolute;inset:0;width:100%;height:100%;border:0}
#prompt{position:absolute;inset:auto 16px 64px;z-index:1;text-align:center;padding:16px;background:#101311ed;border:1px solid #ffffff30;border-radius:12px;max-width:520px;margin:auto;pointer-events:none}
#prompt button{pointer-events:auto}
#prompt p{line-height:1.5;color:#d6ddd7;margin:0 0 16px}
button{min-height:46px;padding:10px 18px;border:1px solid #ffffff38;border-radius:8px;background:#242b25;color:#fff;font:inherit;cursor:pointer}
button:hover{background:#354037}button:focus-visible,select:focus-visible{outline:3px solid #edb65d;outline-offset:3px}
button:disabled{opacity:.5;cursor:wait}
#start{background:#edb65d;color:#181d19;border:0;font-weight:bold}
[hidden]{display:none!important}
footer{padding:16px 24px 20px;background:#101311}
#progress{width:100%;height:5px;display:block;accent-color:#edb65d;margin:0 0 14px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#time{direction:ltr;unicode-bidi:isolate;font-size:14px;color:#c4cbc5;font-variant-numeric:tabular-nums;margin-inline:4px auto}
#status{font-size:13px;color:#c4cbc5;line-height:1.5;margin:12px 0 0;min-height:20px}
#captions{min-height:46px;max-width:160px;border:1px solid #ffffff38;border-radius:8px;background:#242b25;color:white;font:inherit;padding:8px}
@media(max-width:600px){header{padding:14px 16px}header span{max-width:130px;text-align:left}footer{padding:12px 16px 16px}.toolbar{gap:8px}button{padding:10px 12px}#time{font-size:12px}#stage{min-height:220px}}
</style>
</head>
<body>
<main id="induction">
  <header><strong>مهرجان الحصن 2027</strong><span>العربية · عرض جماعي للمقاولين</span></header>
  <section id="stage" aria-label="فيديو التعريف بالصحة والسلامة باللغة العربية">
    <iframe id="player" title="فيديو التعريف بالصحة والسلامة باللغة العربية لمهرجان الحصن 2027" src="https://player.vimeo.com/video/1241992534?autoplay=0&amp;muted=0&amp;quality=1080p&amp;controls=0&amp;progress_bar=0&amp;keyboard=0&amp;skipping_forward=0&amp;speed=0&amp;pip=0&amp;title=0&amp;byline=0&amp;portrait=0&amp;vimeo_logo=0&amp;loop=0&amp;playsinline=1&amp;dnt=1" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="prompt"><p id="prompt-text">جارٍ تحميل فيديو التعريف باللغة العربية…</p><button id="start" hidden>تشغيل الفيديو</button><button id="retry" hidden>إعادة تحميل المشغل</button></div>
  </section>
  <footer>
    <progress id="progress" max="100" value="0" aria-label="تقدم الفيديو"></progress>
    <div class="toolbar">
      <button id="toggle" disabled>تشغيل</button>
      <span id="time">0:00 / --:--</span>
      <select id="captions" aria-label="الترجمة النصية" hidden></select>
      <button id="fullscreen">ملء الشاشة</button>
    </div>
    <p id="status" role="status" aria-live="polite">عرض جماعي للمقاولين · يُرجى توثيق الحضور باستخدام إقرار المقاول وقائمة العاملين.</p>
  </footer>
</main>

<script>
'use strict';
const el = id => document.getElementById(id);
let player, ready = false, playing = false, correcting = false, completed = false;
let maxWatched = 0, duration = 0, lastSeconds = 0, lastTick = performance.now(), startupTimer;
function clock(seconds){
  const value = Math.max(0, Math.floor(seconds));
  return Math.floor(value / 60) + ':' + String(value % 60).padStart(2, '0');
}
function prompt(message, showButton = true){
  el('prompt-text').textContent = message;
  el('prompt').hidden = false;
  el('start').hidden = !showButton;
  el('retry').hidden = showButton;
}
function status(message){ el('status').textContent = message; }
function saveProgress(){}
async function correctSeek(){
  if (correcting || !ready) return;
  correcting = true;
  status('يرجى مشاهدة الفيديو بالكامل.');
  try { lastSeconds = await player.setCurrentTime(maxWatched); }
  catch (_) { status('تعذرت استعادة موضع التشغيل. يرجى إعادة تحميل الصفحة.'); }
  finally { lastTick = performance.now(); correcting = false; }
}
async function play(withSound = false){
  if (!ready || completed) return;
  clearTimeout(startupTimer);
  prompt('جارٍ بدء تشغيل الفيديو…', false);
  startupTimer = setTimeout(() => {
    if (!completed && !el('prompt').hidden) prompt('لم يبدأ تشغيل الفيديو. اضغط على تشغيل الفيديو للمحاولة مجددًا.');
  }, 12000);
  try {
    if (withSound) {
      await player.setMuted(false);
      await player.setVolume(1).catch(() => {});
    }
    await player.play();
    if (await player.getMuted()) {
      await player.pause();
      prompt('اضغط على تشغيل الفيديو لبدء عرض الفيديو بالصوت.');
    }
  }
  catch (_) { prompt('اضغط على تشغيل الفيديو لبدء عرض الفيديو بالصوت.'); }
}
el('start').addEventListener('click', () => play(true));
el('retry').addEventListener('click', () => window.location.reload());
el('toggle').addEventListener('click', async () => {
  if (!ready) return;
  if (completed) {
    completed = false; maxWatched = 0; lastSeconds = 0;
    await player.setCurrentTime(0);
    status('عرض جماعي للمقاولين · يُرجى توثيق الحضور باستخدام إقرار المقاول وقائمة العاملين.');
  }
  if (!playing) return play(true);
  try { await player.pause(); } catch (_) { status('يرجى محاولة إيقاف الفيديو مؤقتًا مرة أخرى.'); }
});
el('fullscreen').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (el('induction').requestFullscreen) await el('induction').requestFullscreen();
    else if (ready) await player.requestFullscreen();
  } catch (_) { status('وضع ملء الشاشة غير متاح في هذا المتصفح.'); }
});
document.addEventListener('fullscreenchange', () => {
  el('fullscreen').textContent = document.fullscreenElement ? 'إنهاء ملء الشاشة' : 'ملء الشاشة';
});
el('captions').addEventListener('change', async event => {
  try {
    if (event.target.value) await player.enableTextTrack(event.target.value);
    else await player.disableTextTrack();
  } catch (_) { status('تعذر تغيير الترجمة النصية. يرجى المحاولة مجددًا.'); }
});
function updateProgress(data){
  if (!ready || completed || correcting) return;
  const now = performance.now();
  const elapsed = Math.max(0, (now - lastTick) / 1000);
  duration = data.duration || duration;
  // Browser deterrent only: this is not server-verified completion or identity.
  if (data.seconds > maxWatched + Math.max(1.25, elapsed + 0.75) || (data.seconds - lastSeconds > elapsed + 0.75 && data.seconds > maxWatched)) {
    void correctSeek();
    return;
  }
  if (playing && data.seconds > maxWatched) { maxWatched = data.seconds; saveProgress(); }
  lastSeconds = data.seconds;
  lastTick = now;
  if (playing && data.seconds > 0) { clearTimeout(startupTimer); el('prompt').hidden = true; }
  el('progress').value = duration ? Math.min(100, data.seconds / duration * 100) : 0;
  el('time').textContent = clock(data.seconds) + ' / ' + clock(duration);
}
async function finish(){
  if (completed || correcting || !duration || maxWatched < duration - 1.25) {
    if (!completed) { await correctSeek(); prompt('يرجى إكمال الفيديو التعريفي بالكامل.'); }
    return;
  }
  completed = true;
  playing = false;
  el('toggle').disabled = false;
  el('toggle').textContent = 'إعادة التشغيل';
  el('progress').value = 100;
  status('انتهى الفيديو. يُرجى إكمال إقرار المقاول وقائمة العاملين الذين حضروا العرض.');
}
async function initialise(){
  if (!window.Vimeo) { prompt('تعذر تحميل مشغل الفيديو. يرجى التحقق من الاتصال وإعادة تحميل الصفحة.', false); return; }
  player = new Vimeo.Player(el('player'));
  const loadTimer = setTimeout(() => {
    if (!ready) prompt('يستغرق تحميل الفيديو وقتًا أطول من المعتاد. تحقق من الاتصال أو أعد تحميل الصفحة.', false);
  }, 20000);
  player.on('play', () => { playing = true; lastTick = performance.now(); el('toggle').textContent = 'إيقاف مؤقت'; });
  player.on('playing', () => { playing = true; clearTimeout(startupTimer); el('prompt').hidden = true; });
  player.on('bufferstart', () => { status('جارٍ تحميل الفيديو…'); });
  player.on('bufferend', () => { status('عرض جماعي للمقاولين · يُرجى توثيق الحضور باستخدام إقرار المقاول وقائمة العاملين.'); });
  player.on('pause', () => { playing = false; el('toggle').textContent = 'تشغيل'; });
  player.on('timeupdate', updateProgress);
  player.on('seeking', data => { if (ready && data.seconds > maxWatched + 0.5) void correctSeek(); });
  player.on('seeked', data => { lastSeconds = data.seconds; lastTick = performance.now(); });
  player.on('playbackratechange', data => { if (data.playbackRate !== 1) player.setPlaybackRate(1).catch(() => { player.pause().catch(() => {}); status('يرجى تشغيل الفيديو بالسرعة العادية.'); }); });
  player.on('ended', finish);
  player.on('error', () => { prompt('تعذر تشغيل الفيديو. يرجى إعادة تحميل الصفحة أو التواصل مع فريق التعريف إذا استمرت المشكلة.', false); });
  try {
    await player.ready();
    clearTimeout(loadTimer);
    // Enable our Play control before waiting for metadata: some browsers only
    // load the duration after playback is requested when Vimeo controls are hidden.
    ready = true;
    el('toggle').disabled = false;
    const initialPlayback = play();
    duration = await player.getDuration();
    ready = true;
    lastTick = performance.now();
    el('toggle').disabled = false;
    el('time').textContent = clock(lastSeconds) + ' / ' + clock(duration);
    player.setQuality('1080p').catch(() => { status('تم طلب دقة 1080p؛ قد يستخدم هذا الجهاز ضبط الجودة تلقائيًا.'); });
    player.getTextTracks().then(tracks => {
      if (!tracks.length) return;
      el('captions').append(new Option('بدون ترجمة', ''));
      tracks.forEach(track => el('captions').append(new Option(track.label || track.language, track.language)));
      el('captions').hidden = false;
    }).catch(() => {});
    await initialPlayback;
  } catch (_) {
    clearTimeout(loadTimer);
    prompt('تعذر تحميل هذا الفيديو. يرجى التحقق من الاتصال وإعدادات السماح بتضمين الفيديو على Vimeo.', false);
  }
}
void initialise();
</script>
